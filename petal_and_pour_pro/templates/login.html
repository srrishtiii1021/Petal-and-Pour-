<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin sign in | Petal & Pour</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="login-page"><main class="login-card"><a class="logo" href="/">✿ petal <i>&</i> pour</a><span class="eyebrow">Garden desk</span><h1>Admin sign in</h1><form method="post" action="{{url_for('admin_login_post')}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Username<input name="username" required autocomplete="username"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="button button-dark full-btn">Sign in</button></form>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{category}}">{{message}}</div>{% endfor %}{% endwith %}</main></body></html>
